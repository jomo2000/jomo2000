<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Natural Voice Study Reader</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
  }

  .container {
    width: 600px;
    max-width: 92%;
  }

  h1 {
    text-align: center;
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    height: 220px;
    padding: 15px;
    font-size: 16px;
    border-radius: 12px;
    border: none;
    outline: none;
    resize: none;
  }

  button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    background: #7c3aed;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background: #6d28d9;
  }

  .hint {
    text-align: center;
    font-size: 12px;
    opacity: 0.7;
    margin-top: 8px;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Study Voice Reader</h1>

  <textarea id="text" placeholder="Paste your study notes or story here..."></textarea>

  <button onclick="speakText()">Speak</button>

  <div class="hint">Tip: Use “...” commas, and line breaks for more natural speech</div>
</div>

<script>

// Pick best available voice
function getBestVoice() {
  const voices = speechSynthesis.getVoices();

  const preferred = [
    "Microsoft Aria",
    "Microsoft Jenny",
    "Microsoft Ava",
    "Samantha",
    "Google UK English Female"
  ];

  for (let p of preferred) {
    const found = voices.find(v => v.name.includes(p));
    if (found) return found;
  }

  return voices[0];
}

// Split text into natural speech chunks
function splitText(text) {
  return text
    .replace(/\n/g, ". ")
    .match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
}

function speakText() {

  const text = document.getElementById("text").value;

  if (!text.trim()) return;

  speechSynthesis.cancel();

  const voices = speechSynthesis.getVoices();
  const voice = getBestVoice();

  const chunks = splitText(text);

  let i = 0;

  function speakNext() {

    if (i >= chunks.length) return;

    const utterance = new SpeechSynthesisUtterance(chunks[i]);

    utterance.voice = voice;

    // HUMAN-LIKE SETTINGS
    utterance.rate = 0.88;   // slower = more natural
    utterance.pitch = 1.05;  // slight warmth
    utterance.volume = 1;

    utterance.onend = () => {
      i++;
      setTimeout(speakNext, 220); // natural pause between sentences
    };

    speechSynthesis.speak(utterance);
  }

  speakNext();
}

// Ensure voices load properly
speechSynthesis.onvoiceschanged = () => {
  speechSynthesis.getVoices();
};

// Enter key to speak
document.getElementById("text").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    speakText();
  }
});

</script>

</body>
</html>
