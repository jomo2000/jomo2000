<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Voice Reader</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      width: 500px;
      max-width: 90%;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 15px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      resize: none;
      outline: none;
    }

    button {
      margin-top: 15px;
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #6366f1;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Woman Voice Reader</h1>

    <textarea id="textInput" placeholder="Type something here..."></textarea>

    <br>

    <button onclick="speakText()">Speak</button>
  </div>

  <script>
    function speakText() {
      const text = document.getElementById("textInput").value;

      if (!text) return;

      const speech = new SpeechSynthesisUtterance();

      speech.text = text;
      speech.rate = 1;
      speech.pitch = 1;

      // Load available voices
      const voices = window.speechSynthesis.getVoices();

      // Try to find a female-sounding English voice
      const femaleVoice =
        voices.find(v =>
          v.name.includes("Female") ||
          v.name.includes("Samantha") ||
          v.name.includes("Google UK English Female")
        ) || voices[0];

      speech.voice = femaleVoice;

      window.speechSynthesis.speak(speech);
    }

    // Required for some browsers to load voices properly
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.getVoices();
    };

    // Press Enter to speak
    document
      .getElementById("textInput")
      .addEventListener("keydown", function(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          speakText();
        }
      });
  </script>

</body>
</html>
