<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Natural Voice Reader</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
  }

  .container {
    width: 600px;
    max-width: 92%;
  }

  h1 {
    text-align: center;
  }

  textarea {
    width: 100%;
    height: 200px;
    padding: 15px;
    font-size: 16px;
    border-radius: 12px;
    border: none;
    outline: none;
    resize: none;
  }

  .controls {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .slider-box {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    opacity: 0.9;
  }

  input[type="range"] {
    width: 100%;
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    background: #7c3aed;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background: #6d28d9;
  }

  .hint {
    text-align: center;
    font-size: 12px;
    opacity: 0.7;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Study Voice Reader</h1>

  <textarea id="text" placeholder="Paste your notes or story here..."></textarea>

  <div class="controls">

    <!-- SPEED -->
    <div class="slider-box">
      <span>Speed</span>
      <span id="speedValue">0.75x</span>
    </div>
    <input type="range" id="speedSlider" min="0.5" max="1.2" step="0.01" value="0.75">

    <!-- PITCH -->
    <div class="slider-box">
      <span>Pitch (deeper ↔ higher)</span>
      <span id="pitchValue">1.00</span>
    </div>
    <input type="range" id="pitchSlider" min="0.5" max="1.5" step="0.01" value="1.00">

    <button onclick="speakText()">Speak</button>

    <div class="hint">
      Tip: Lower pitch (0.7–0.95) = deeper, more natural voice
    </div>

  </div>
</div>

<script>

// UI updates
const speedSlider = document.getElementById("speedSlider");
const pitchSlider = document.getElementById("pitchSlider");

const speedValue = document.getElementById("speedValue");
const pitchValue = document.getElementById("pitchValue");

speedSlider.addEventListener("input", () => {
  speedValue.textContent = speedSlider.value + "x";
});

pitchSlider.addEventListener("input", () => {
  pitchValue.textContent = pitchSlider.value;
});

// Voice selection
function getBestVoice() {
  const voices = speechSynthesis.getVoices();

  const preferred = [
    "Microsoft Aria",
    "Microsoft Jenny",
    "Microsoft Ava",
    "Samantha",
    "Google UK English Female"
  ];

  for (let p of preferred) {
    const found = voices.find(v => v.name.includes(p));
    if (found) return found;
  }

  return voices[0];
}

// Split into natural chunks
function splitText(text) {
  return text
    .replace(/\n/g, ". ")
    .match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
}

function speakText() {

  const text = document.getElementById("text").value;
  if (!text.trim()) return;

  speechSynthesis.cancel();

  const voice = getBestVoice();

  const rate = parseFloat(speedSlider.value);
  const pitch = parseFloat(pitchSlider.value);

  const chunks = splitText(text);

  let i = 0;

  function speakNext() {

    if (i >= chunks.length) return;

    const utterance = new SpeechSynthesisUtterance(chunks[i]);

    utterance.voice = voice;

    // HUMAN CONTROLS
    utterance.rate = rate;
    utterance.pitch = pitch;
    utterance.volume = 1;

    utterance.onend = () => {
      i++;
      setTimeout(speakNext, 200);
    };

    speechSynthesis.speak(utterance);
  }

  speakNext();
}

// load voices
speechSynthesis.onvoiceschanged = () => {
  speechSynthesis.getVoices();
};

// Enter to speak
document.getElementById("text").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    speakText();
  }
});

</script>

</body>
</html>
