<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Audiobook Voice Reader</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
  }

  .container {
    width: 650px;
    max-width: 92%;
  }

  h1 {
    text-align: center;
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    height: 200px;
    padding: 15px;
    font-size: 16px;
    border-radius: 12px;
    border: none;
    outline: none;
    resize: none;
  }

  .controls {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    opacity: 0.9;
  }

  input[type="range"], select {
    width: 100%;
  }

  select {
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    background: #7c3aed;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background: #6d28d9;
  }

  .hint {
    text-align: center;
    font-size: 12px;
    opacity: 0.7;
  }
</style>
</head>

<body>

<div class="container">

  <h1>Audiobook Voice Reader</h1>

  <textarea id="text" placeholder="Paste your notes, story, or study guide here..."></textarea>

  <div class="controls">

    <!-- PRESET -->
    <select id="preset" onchange="applyPreset()">
      <option value="normal">🎧 Normal Narrator</option>
      <option value="deep">🎬 Deep Cinematic</option>
      <option value="soft">🌙 Soft Whisper Style</option>
      <option value="teacher">📘 Teacher Mode</option>
      <option value="dramatic">🎭 Dramatic Storytelling</option>
    </select>

    <!-- SPEED -->
    <div class="row">
      <span>Speed</span>
      <span id="speedValue">0.75x</span>
    </div>
    <input type="range" id="speedSlider" min="0.5" max="1.2" step="0.01" value="0.75">

    <!-- PITCH -->
    <div class="row">
      <span>Pitch</span>
      <span id="pitchValue">0.95</span>
    </div>
    <input type="range" id="pitchSlider" min="0.5" max="1.5" step="0.01" value="0.95">

    <button onclick="speakText()">Speak</button>

    <div class="hint">
      Tip: Lower pitch + slower speed = more natural audiobook sound
    </div>

  </div>
</div>

<script>

// UI updates
const speedSlider = document.getElementById("speedSlider");
const pitchSlider = document.getElementById("pitchSlider");

speedSlider.oninput = () =>
  document.getElementById("speedValue").textContent = speedSlider.value + "x";

pitchSlider.oninput = () =>
  document.getElementById("pitchValue").textContent = pitchSlider.value;

// Voice selection
function getBestVoice() {
  const voices = speechSynthesis.getVoices();

  const preferred = [
    "Microsoft Aria",
    "Microsoft Jenny",
    "Microsoft Ava",
    "Samantha",
    "Google UK English Female"
  ];

  for (let p of preferred) {
    const found = voices.find(v => v.name.includes(p));
    if (found) return found;
  }

  return voices[0];
}

// Clean messy text into smoother speech
function cleanText(text) {
  return text
    .replace(/\n/g, ". ")
    .replace(/\s+/g, " ")
    .replace(/—/g, "... ")
    .replace(/:/g, ", ")
    .replace(/;/g, ", ");
}

// Split into natural chunks
function splitText(text) {
  return text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
}

// PRESET SYSTEM
function applyPreset() {

  const preset = document.getElementById("preset").value;

  if (preset === "normal") {
    speedSlider.value = 0.75;
    pitchSlider.value = 0.95;
  }

  if (preset === "deep") {
    speedSlider.value = 0.72;
    pitchSlider.value = 0.80;
  }

  if (preset === "soft") {
    speedSlider.value = 0.68;
    pitchSlider.value = 1.05;
  }

  if (preset === "teacher") {
    speedSlider.value = 0.78;
    pitchSlider.value = 0.98;
  }

  if (preset === "dramatic") {
    speedSlider.value = 0.80;
    pitchSlider.value = 1.10;
  }

  speedSlider.oninput();
  pitchSlider.oninput();
}

function speakText() {

  const raw = document.getElementById("text").value;
  if (!raw.trim()) return;

  speechSynthesis.cancel();

  const text = cleanText(raw);
  const voice = getBestVoice();

  const rate = parseFloat(speedSlider.value);
  const pitch = parseFloat(pitchSlider.value);

  const chunks = splitText(text);

  let i = 0;

  function speakNext() {

    if (i >= chunks.length) return;

    const utterance = new SpeechSynthesisUtterance(chunks[i]);

    utterance.voice = voice;

    utterance.rate = rate;
    utterance.pitch = pitch;
    utterance.volume = 1;

    utterance.onend = () => {
      i++;
      setTimeout(speakNext, 180);
    };

    speechSynthesis.speak(utterance);
  }

  speakNext();
}

// load voices
speechSynthesis.onvoiceschanged = () => {
  speechSynthesis.getVoices();
};

// Enter to speak
document.getElementById("text").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    speakText();
  }
});

</script>

</body>
</html>
