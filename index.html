<!DOCTYPE html>
<html>

<head>
<title>Jomo's Retro Website</title>

<style>

body{
  background:black;
  color:#00ffff;
  font-family:Courier New, monospace;
  text-align:center;
}

h1{
  font-size:48px;
  text-shadow:0 0 10px cyan;
}

/* Desktop Icons */

.desktop-icons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:40px;
}

.icon{
  width:120px;
  margin:20px;
  text-align:center;
  color:#00ffff;
  text-decoration:none;
  font-size:16px;
}

.icon img{
  width:64px;
  height:64px;
  display:block;
  margin:0 auto 10px;
  border:2px solid #00ffff;
  padding:4px;
  background:black;
}

.icon:hover img{
  background:#00ffff;
}

.icon:hover p{
  color:black;
}

/* CENTER WIDGET (visitor counter + music) */

.center-widget{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:240px;
  background:black;
  border:3px solid #00ffff;
  box-shadow:0 0 10px #00ffff;
  padding:10px;
  z-index:900;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.visitor-counter{
  font-size:18px;
  margin-bottom:15px;
  text-align:center;
}

.music-player{
  border-top:2px solid #00ffff;
  padding-top:10px;
  width:100%;
}

/* Retro TV */

.tv-video{
  position:fixed;
  top:50%;
  right:20px;
  transform:translateY(-50%);
  width:340px;
  height:200px;
  padding:10px;
  background:black;
  border:5px solid #00ffff;
  box-shadow:0 0 20px #00ffff;
}

.tv-video iframe{
  width:100%;
  height:100%;
  border:none;
}

/* Left Link Box (8008135) */

.link-box{
  position:fixed;
  top:50%;
  left:20px;
  transform:translateY(-50%);
  width:340px;        /* same as TV */
  height:200px;       /* same as TV */
  padding:10px;
  background:black;
  border:5px solid #00ffff; /* match TV border */
  box-shadow:0 0 20px #00ffff, inset 0 0 5px #00ffff;
  text-align:left;
  overflow:auto;      /* scroll if content exceeds height */
}

.link-box h2{
  font-size:22px;
  margin-bottom:10px;
}

.link-box ul{
  list-style:none;
  padding-left:5px;
}

.link-box li{
  margin-bottom:6px;
}

.link-box a{
  color:#00ffff;
  text-decoration:none;
  border:1px solid #0ff;
  padding:2px 4px;
  display:block;
  font-size:16px;
}

.link-box a:hover{
  background:#00ffff;
  color:black;
}

/* Skateboard Cat */

.skateboarder{
  position:fixed;
  bottom:0;
  left:-150px;
  width:200px;
  z-index:1000;
  animation:skate 10s linear infinite;
}

.skateboarder img{
  width:200px;
}

@keyframes skate{
  0%{left:-150px;}
  100%{left:100%;}
}

</style>

</head>

<body>

<h1>Welcome to My Website</h1>

<p>My personal corner of the internet</p>
