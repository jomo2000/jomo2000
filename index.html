<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Jomo's Website</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Rubik+Glitch&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #e2e8f0; /* blue-gray */
      color: #1e1e1e;
    }

    /* Header */
    header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    header h1 {
      font-family: 'Rubik Glitch', cursive;
      font-size: 42px;
      margin-bottom: 10px;
    }

    header p {
      color: #555;
      font-size: 16px;
    }

    /* Navigation */
    .desktop-icons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
      text-align: center;
    }

    .icon {
      text-decoration: none;
      color: #333;
      background: white;
      border-radius: 14px;
      padding: 15px;
      width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      transition: all 0.2s ease;
    }

    .icon img {
      width: 50px;
      height: 50px;
      margin-bottom: 8px;
    }

    .icon p {
      margin: 0;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    .icon:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.15);
    }

    /* Content layout */
    .below-icons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 25px;
      padding: 30px;
      text-align: center;
    }

    .content-box {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 320px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      text-align: center;
    }

    /* Links box centered */
    .link-box h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .link-box ul {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: center;
    }

    .link-box li {
      margin-bottom: 10px;
    }

    .link-box a {
      text-decoration: none;
      color: #0077ff;
      font-size: 14px;
    }

    .link-box a:hover {
      text-decoration: underline;
    }

    /* Video */
    .tv-video iframe {
      width: 100%;
      height: 200px;
      border-radius: 10px;
      border: none;
    }

    /* Visitor + music centered */
    .visitor-counter {
      text-align: center;
    }

    .visitor-counter p {
      margin-bottom: 5px;
      font-size: 14px;
      color: #555;
    }

    .visitor-counter img {
      display: block;
      margin: 0 auto 15px;
      pointer-events: none;
    }

    .music-player {
      display: flex;
      justify-content: center;
    }

    .music-player audio {
      width: 100%;
    }

    /* Skateboard cat */
    .skateboarder {
      position: fixed;
      bottom: 10px;
      left: -150px;
      width: 100px;
      animation: skate 10s linear infinite;
    }

    .skateboarder img {
      width: 100px;
    }

    @keyframes skate {
      0% { left: -150px; }
      100% { left: 100%; }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .content-box {
        width: 90%;
      }
    }

  </style>
</head>

<body>

  <header>
    <h1>Welcome to Jomo's World ⚡</h1>
    <p>Explore, vibe, and stay awhile</p>
  </header>

  <!-- Navigation -->
  <div class="desktop-icons">

    <a href="recipes.html" class="icon">
      <img src="recipes-icon.png">
      <p>Recipes</p>
    </a>

    <a href="music-videos.html" class="icon">
      <img src="music-videos-icon.png">
      <p>Music Videos</p>
    </a>

    <a href="webkinz.html" class="icon">
      <img src="webkinz-icon.png">
      <p>Webkinz</p>
    </a>

    <a href="tv-shows.html" class="icon">
      <img src="tv-shows-icon.png">
      <p>TV Shows</p>
    </a>

    <a href="movies.html" class="icon">
      <img src="movies-icon.png">
      <p>Movies</p>
    </a>

    <a href="cable-tv.html" class="icon">
      <img src="cable-tv-schedule-icon.png">
      <p>Cable TV</p>
    </a>

    <a href="2000s-nostalgia.html" class="icon">
      <img src="early-2000s-nostalgia.png">
      <p>Early 2000s</p>
    </a>

  </div>

  <!-- Content -->
  <div class="below-icons">

    <!-- Links -->
    <div class="content-box link-box">
      <h2>Links</h2>
      <ul>
        <li><a href="https://pointerpointer.com/" target="_blank">Pointer Pointer</a></li>
        <li><a href="https://www.addictinggames.com/" target="_blank">Addicting Games</a></li>
        <li><a href="https://00s.myretrotvs.com/#qi7Yh16dA0w" target="_blank">00s Retro TV</a></li>
        <li><a href="https://jspaint.app/#local:c9f4259460c408" target="_blank">JS Paint</a></li>
      </ul>
    </div>

    <!-- Video -->
    <div class="content-box tv-video">
      <iframe src="https://www.youtube.com/embed/qO0WvudbO04" allowfullscreen></iframe>
    </div>

    <!-- Counter + Music -->
    <div class="content-box">
      <div class="visitor-counter">
        <p>Visitors</p>
        <img src="https://hitwebcounter.com/counter/counter.php?page=19420542&style=0006&nbdigits=5&type=page&initCount=0">
      </div>
      <div class="music-player">
        <audio controls>
          <source src="music.mp3" type="audio/mpeg">
        </audio>
      </div>
    </div>

  </div>

  <!-- Skateboard Cat -->
  <div class="skateboarder">
    <img src="skateboarder-cat.gif">
  </div>

</body>
</html>
