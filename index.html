<!DOCTYPE html>
<html>

<head>
  <title>Jomo's Retro Website</title>

  <style>
    body {
      background: black;
      color: #00ffff;
      font-family: Courier New, monospace;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      text-shadow: 0 0 10px cyan;
    }

    /* --- Desktop icons styles --- */
    .desktop-icons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 50px;
    }

    .icon {
      width: 120px;
      margin: 20px;
      text-align: center;
      color: #00ffff;
      text-decoration: none;
      font-size: 16px;
    }

    .icon img {
      width: 64px;
      height: 64px;
      display: block;
      margin: 0 auto 10px;
      border: 2px solid #00ffff;
      padding: 4px;
      background: black;
    }

    .icon:hover img {
      background: #00ffff;
    }

    .icon:hover p {
      color: black;
    }

    /* --- Skateboarder animation --- */
    .skateboarder {
      position: fixed;
      bottom: 0;
      left: -120px;
      z-index: 1000; /* above TV and icons */
      width: 100px;
      animation: skate 10s linear infinite;
    }

    .skateboarder img {
      width: 100px;
      height: auto;
      display: block;
    }

    @keyframes skate {
      0% {
        left: -120px;
      }

      100% {
        left: 100%;
      }
    }

    /* --- Retro TV video --- */
    .tv-video {
      position: fixed;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      width: 340px;
      height: 200px;
      padding: 10px;
      background: #000;
      border: 5px solid #0ff;
      box-shadow: 0 0 20px #0ff, inset 0 0 5px #0ff;
      z-index: 900; /* below skateboarder */
    }

    .tv-video iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* --- Retro left-side link box --- */
    .link-box {
      position: fixed;
      top: 50%;
      left: 20px;           /* moved box to left */
      transform: translateY(-50%);
      width: 200px;
      padding: 10px;
      background: black;
      border: 3px solid #0ff;
      box-shadow: 0 0 10px #0ff, inset 0 0 5px #0ff;
      color: #00ffff;
      font-family: Courier New, monospace;
      text-align: left;
      z-index: 900;         /* below skateboarder */
    }

    .link-box h2 {
      font-size: 20px;
      margin-bottom: 10px;
      text-align: left;
      padding-left: 5px;
      text-shadow: 0 0 5px #0ff;
    }

    .link-box ul {
      list-style-type: none;
      padding-left: 5px;
    }

    .link-box ul li {
      margin-bottom: 6px;
    }

    .link-box ul li a {
      color: #00ffff;
      text-decoration: none;
      border: 1px solid #0ff;
      padding: 2px 4px;
      display: block;
    }

    .link-box ul li a:hover {
      background: #0ff;
      color: black;
    }
  </style>

</head>

<body>

  <h1>Welcome to My Website</h1>
  <p>My personal corner of the internet</p>

  <div class="desktop-icons">

    <a href="recipes.html" class="icon">
      <img src="recipes-icon.png" alt="Recipes" />
      <p>Recipes</p>
    </a>

    <a href="music-videos.html" class="icon">
      <img src="music-videos-icon.png" alt="Music Videos" />
      <p>Music Videos</p>
    </a>

    <a href="webkinz.html" class="icon">
      <img src="webkinz-icon.png" alt="Webkinz" />
      <p>Webkinz</p>
    </a>

    <a href="tv-shows.html" class="icon">
      <img src="tv-shows-icon.png" alt="TV Shows" />
      <p>TV Shows</p>
    </a>

    <a href="movies.html" class="icon">
      <img src="movies-icon.png" alt="Movies" />
      <p>Movies</p>
    </a>

    <a href="cable-tv.html" class="icon">
      <img src="cable-tv-schedule-icon.png" alt="Cable TV" />
      <p>Cable TV</p>
    </a>

    <a href="2000s-nostalgia.html" class="icon">
      <img src="early-2000s-nostalgia.png" alt="2000s Nostalgia" />
      <p>Early 2000s</p>
    </a>

  </div>

  <!-- Retro TV video -->
  <div class="tv-video">
    <iframe width="560" height="315" src="https://www.youtube.com/embed/uQ7nLPc8lxs?si=2Ol9Ink61PNiU7-S" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>

  <!-- Retro left-side link box -->

      <li><a href="https://pointerpointer.com/" target="_blank">Pointer Pointer</a></li>

    </ul>
  </div>

  <!-- Skateboarder cat -->
  <div class="skateboarder">
    <img src="skateboarder-cat.gif" alt="Skateboarder" />
  </div>

</body>

</html>
