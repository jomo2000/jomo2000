<!DOCTYPE html>
<html>

<head>
<title>Jomo's Retro Website</title>

<style>

body{
background:black;
color:#00ffff;
font-family:Courier New, monospace;
text-align:center;
}

h1{
font-size:48px;
text-shadow:0 0 10px cyan;
}

/* Desktop icons */

.desktop-icons{
display:flex;
flex-wrap:wrap;
justify-content:center;
margin-top:40px;
}

.icon{
width:120px;
margin:20px;
text-align:center;
color:#00ffff;
text-decoration:none;
font-size:16px;
}

.icon img{
width:64px;
height:64px;
display:block;
margin:0 auto 10px;
border:2px solid #00ffff;
padding:4px;
background:black;
}

.icon:hover img{
background:#00ffff;
}

.icon:hover p{
color:black;
}

/* Widgets (visitor counter + music player) */

.site-widgets{
margin-top:30px;
}

.visitor-counter{
margin-bottom:20px;
font-size:22px;
}

.music-player{
border:3px solid #00ffff;
box-shadow:0 0 10px #00ffff;
padding:10px;
width:320px;
margin:auto;
background:black;
}

/* Retro TV */

.tv-video{
position:fixed;
top:50%;
right:20px;
transform:translateY(-50%);
width:340px;
height:200px;
padding:10px;
background:#000;
border:5px solid #0ff;
box-shadow:0 0 20px #0ff, inset 0 0 5px #0ff;
z-index:900;
}

.tv-video iframe{
width:100%;
height:100%;
border:none;
}

/* Left link box */

.link-box{
position:fixed;
top:50%;
left:20px;
transform:translateY(-50%);
width:200px;
padding:10px;
background:black;
border:3px solid #0ff;
box-shadow:0 0 10px #0ff, inset 0 0 5px #0ff;
color:#00ffff;
text-align:left;
}

.link-box h2{
font-size:20px;
margin-bottom:10px;
}

.link-box ul{
list-style-type:none;
padding-left:5px;
}

.link-box ul li{
margin-bottom:6px;
}

.link-box ul li a{
color:#00ffff;
text-decoration:none;
border:1px solid #0ff;
padding:2px 4px;
display:block;
}

.link-box ul li a:hover{
background:#0ff;
color:black;
}

/* Skateboarder */

.skateboarder{
position:fixed;
bottom:0;
left:-150px;
z-index:1000;
width:150px;
animation:skate 10s linear infinite;
}

.skateboarder img{
width:150px;
height:auto;
display:block;
}

@keyframes skate{
0%{left:-150px;}
100%{left:100%;}
}

</style>

</head>
