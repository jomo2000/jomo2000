body{

h1{
  font-size:48px;
  text-shadow:0 0 10px cyan;

/* --- Desktop icons styles --- */
.desktop-icons{
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 50px;
}

.icon{
  width: 120px;
  margin: 20px;
  text-align: center;
  color: #00ffff;
  text-decoration: none;
  font-size: 16px;
}

.icon img{
  width: 64px;
  height: 64px;
  display: block;
  margin: 0 auto 10px;
  border: 2px solid #00ffff;
  padding: 4px;
  background: black;
}

.icon:hover img{
  background: #00ffff;
}

.icon:hover p{
  color: black;
}

  <div class="desktop-icons">
  <!-- all your icons here -->
</div>

<!-- --- Add this block for the retro TV video --- -->
<div class="tv-video">
  <iframe width="320" height="180" 
          src="https://www.youtube.com/watch?v=uQ7nLPc8lxs&list=PLf3VYtK8bOR2-smc-2Eh5P3kOaNP59dqA&index=10" 
          title="YouTube video player" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
  </iframe>
</div>

<!-- Skateboarder animation -->
<div class="skateboarder">
  <img src="skateboarder-cat.gif" alt="Skateboarder" />
</div>
  
  /* Skateboarder animation */
.skateboarder{
  position: fixed;
  bottom: 0;      /* sticks to bottom of screen */
  left: -120px;   /* start off-screen */
  z-index: 1000;  /* above other content */
  width: 100px;   /* adjust size if needed */
}

.skateboarder img{
  width: 100px;
  height: auto;
  display: block;
}

/* keyframes to move the skateboarder across the screen */
@keyframes skate {
  0% { left: -120px; }
  100% { left: 100%; }
}

/* apply the animation */
.skateboarder{
  animation: skate 10s linear infinite; /* 10s across screen, repeats forever */
}

  /* TV-style video box */
.tv-video{
  position: fixed;
  top: 50%;             /* center vertically */
  right: 20px;          /* distance from right edge */
  transform: translateY(-50%); /* perfectly center */
  width: 340px;         /* TV box width */
  height: 200px;        /* TV box height */
  padding: 10px;
  background: #000;     /* TV body color */
  border: 5px solid #0ff; /* cyan border for retro glow */
  box-shadow: 0 0 20px #0ff, inset 0 0 5px #0ff; /* glowing effect */
  z-index: 900;         /* below skateboarder */
}

.tv-video iframe{
  width: 100%;
  height: 100%;
  border: none;
}

</style>
