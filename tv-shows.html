<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My TV Shows Collection</title>
<style>
body {
  font-family: 'Comic Sans MS', cursive, sans-serif;
  background: url('tv-room-background.jpg') no-repeat center center fixed;
  background-size: cover;
  margin: 0;
  padding: 0;
  color: #fff;
}

header {
  text-align: center;
  padding: 20px;
  background-color: rgba(50, 25, 0, 0.9);
  border-bottom: 4px solid #333;
}

header h1 {
  font-size: 2.5rem;
  color: #cfc9a0;
  text-shadow: 2px 2px #000;
}

/* Grid of TV shows */
.tv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 30px;
  padding: 30px;
  max-width: 1200px;
  margin: auto;
}

/* Individual TV show tile */
.tv-show {
  position: relative;
  cursor: pointer;
  transition: transform 0.2s;
}

.tv-show img {
  width: 100%;
  display: block;
  border: 8px solid #333; 
  border-radius: 15px;
  box-shadow: inset 0 0 10px #222, 0 4px 10px rgba(0,0,0,0.5);
}

.tv-show:hover {
  transform: scale(1.05);
}

/* Expanded show info */
.show-info {
  display: none;
  margin-top: 15px;
  padding: 15px;
  background-color: rgba(0,0,0,0.8);
  border: 3px solid #556B2F;
  border-radius: 10px;
  color: #cfc9a0;
}

.show-info h3 {
  margin-top: 0;
  color: #00ffff;
}

.show-info p {
  margin: 5px 0;
}

/* Minimize button */
.minimize-btn {
  margin-top: 10px;
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  background-color: #556B2F;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
}

.minimize-btn:hover {
  background-color: #6B8E23;
}

/* TV remote GIF */
.remote-gif {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 80px;
  height: auto;
  z-index: 100;
  cursor: pointer;
}

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 12px;
}

::-webkit-scrollbar-track {
  background: #222;
}

::-webkit-scrollbar-thumb {
  background: #556B2F;
  border-radius: 6px;
}

/* Episode/season input style */
.show-info input {
  width: 60px;
  padding: 2px 5px;
  margin-right: 10px;
  border-radius: 5px;
  border: 1px solid #556B2F;
  background-color: #222;
  color: #cfc9a0;
}

/* Posts container */
.posts {
  margin-top: 10px;
  padding-left: 15px;
  border-left: 2px dotted #00ffcc;
}

.posts p {
  margin: 5px 0;
  background-color: rgba(255,255,255,0.05);
  padding: 5px;
  border-radius: 5px;
}
</style>
</head>
<body>

<header>
  <h1>My TV Shows Collection</h1>
</header>

<section class="tv-grid">

  <!-- TV Show Example -->
  <div class="tv-show" data-show-name="Show 1">
    <img src="show1.png" alt="Show 1">
    <div class="show-info">
      <h3>Show 1</h3>
      <p>Rating: ⭐⭐⭐⭐☆</p>
      <p>Episode: <input type="text" value="3"> / Season: <input type="text" value="2"></p>
      <div class="posts" data-posts='[
        "Post 1: Loved this episode because of the plot twist!",
        "Post 2: Funny moment at minute 10 was hilarious!",
        "Post 3: New character introduction was awesome."
      ]'>
      </div>
      <button class="minimize-btn">Minimize</button>
    </div>
  </div>

  <div class="tv-show" data-show-name="Show 2">
    <img src="show2.png" alt="Show 2">
    <div class="show-info">
      <h3>Show 2</h3>
      <p>Rating: ⭐⭐⭐☆☆</p>
      <p>Episode: <input type="text" value="1"> / Season: <input type="text" value="1"></p>
      <div class="posts" data-posts='[
        "Post 1: Interesting plot twist in this episode."
      ]'>
      </div>
      <button class="minimize-btn">Minimize</button>
    </div>
  </div>

  <!-- Add more shows by copying tv-show div and updating data-posts -->
  
</section>

<img class="remote-gif" src="remote.gif" alt="TV Remote">

<script>
// Expand/minimize functionality
document.querySelectorAll('.tv-show').forEach(show => {
  const img = show.querySelector('img');
  const info = show.querySelector('.show-info');
  const minimizeBtn = show.querySelector('.minimize-btn');
  const postsDiv = show.querySelector('.posts');

  // Load posts automatically from data-posts attribute
  const postsArray = JSON.parse(postsDiv.getAttribute('data-posts'));
  postsArray.forEach(post => {
    const p = document.createElement('p');
    p.textContent = post;
    postsDiv.appendChild(p);
  });

  // Show info on click
  img.addEventListener('click', () => {
    info.style.display = 'block';
  });

  // Minimize
  minimizeBtn.addEventListener('click', () => {
    info.style.display = 'none';
  });
});
</script>

</body>
</html>
